[tool.poetry]
name = "mlops-project"
version = "0.1.0"
description = "A production-ready machine learning project"
authors = ["Salman Sakib"]
readme = "README.md"
packages = [{include = "mlops"}]

[tool.poetry.dependencies]
python = "^3.13"
ipykernel = "^7.1.0"
pandas = "^3.0.0"
numpy = "^2.4.2"
matplotlib = "^3.10.8"
plotly = "^6.5.2"
seaborn = "^0.13.2"
scipy = "^1.17.0"
scikit-learn = "^1.8.0"
imbalanced-learn = "^0.14.1"
xgboost = "^3.1.3"
catboost = "^1.2.8"
pymongo = "^4.16.0"
from-root = "^1.3.0"
evidently = "0.2.8"
dill = "^0.4.1"
pyyaml = "^6.0.3"
neuro-mf = "^0.0.5"
boto3 = "^1.42.43"
mypy-boto3-s3 = "^1.42.37"
botocore = "^1.42.43"
fastapi = "<0.100"
uvicorn = "^0.40.0"
jinja2 = "^3.1.6"
python-multipart = "^0.0.22"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
